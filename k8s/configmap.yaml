apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  # PostgresSQL
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ecommerce"

  # Keycloak
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/ecommerce"
  KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs"
  # Canonical issuer = the browser-facing Keycloak URL (KC_HOSTNAME); keys are fetched in-cluster.
  JWT_ISSUER_URI: "http://keycloak.ecommerce.local/realms/ecommerce"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs"
  KEYCLOAK_SERVER_URL: "http://keycloak:8080"
  KEYCLOAK_PUBLIC_SERVER_URL: "http://keycloak.ecommerce.local"

  # Kafka
  KAFKA_SERVERS: "kafka:9092"
  # payment/notification read ${kafka.bootstrap.servers}
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Elasticsearch
  # host:port: ClientConfiguration.connectedTo() rejects a scheme
  ELASTICSEARCH_URL: "elasticsearch:9200"

  # Object storage (RustFS - S3-compatible)
  STORAGE_ENDPOINT: "http://rustfs:9000"
  STORAGE_REGION: "us-east-1"
  STORAGE_BUCKET: "ecommerce-media"

  # Hibernate
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"

  # JVM heap limit
  JAVA_TOOL_OPTIONS: "-Xmx200m -Xms100m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
